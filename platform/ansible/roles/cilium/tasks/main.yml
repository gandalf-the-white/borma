---
# tasks file for ansible/roles/cilium
- name: Wait for kubeconfig
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 60
  when: inventory_hostname in groups['bootstrap']

- name: Set kubeconfig env
  set_fact:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  when: inventory_hostname in groups['bootstrap']

- name: Wait for Kubernetes API
  command: kubectl get nodes
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: result
  retries: 10
  delay: 5
  until: result.rc == 0
  when: inventory_hostname in groups['bootstrap']

- name: Install Helm
  shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  when: inventory_hostname in groups['bootstrap']

- name: Add Cilium repo
  command: helm repo add cilium https://helm.cilium.io
  when: inventory_hostname in groups['bootstrap']

- name: Update repos
  command: helm repo update
  when: inventory_hostname in groups['bootstrap']

- name: Check ServiceMonitor CRD
  command: kubectl get crd servicemonitors.monitoring.coreos.com
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: servicemonitor_crd
  failed_when: false
  changed_when: false
  when: inventory_hostname in groups['bootstrap']

- name: Enable Cilium and Hubble metrics
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    name: cilium
    chart_ref: cilium/cilium
    release_namespace: kube-system
    create_namespace: false
    reset_values: true
    values: "{{ lookup('template', 'templates/values-cilium-metrics.yml.j2') | from_yaml }}"
    wait: true
    timeout: 10m
  when: inventory_hostname in groups['bootstrap']

- name: Verify Cilium pods
  command: kubectl -n kube-system rollout status ds/cilium --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false
  when: inventory_hostname in groups['bootstrap']
