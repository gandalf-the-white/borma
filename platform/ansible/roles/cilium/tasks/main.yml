---
# tasks file for ansible/roles/cilium
- name: Wait for kubeconfig
  wait_for:
    path: /etc/rancher/k3s/k3s.yaml
    timeout: 60
  when: inventory_hostname in groups['bootstrap']

- name: Set kubeconfig env
  set_fact:
    kubeconfig: /etc/rancher/k3s/k3s.yaml
  when: inventory_hostname in groups['bootstrap']

- name: Wait for Kubernetes API
  command: kubectl get nodes
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: result
  retries: 10
  delay: 5
  until: result.rc == 0
  when: inventory_hostname in groups['bootstrap']

- name: Install Helm
  shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  when: inventory_hostname in groups['bootstrap']

- name: Add Cilium repo
  command: helm repo add cilium https://helm.cilium.io
  when: inventory_hostname in groups['bootstrap']

- name: Update repos
  command: helm repo update
  when: inventory_hostname in groups['bootstrap']

- name: Check ServiceMonitor CRD
  command: kubectl get crd servicemonitors.monitoring.coreos.com
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: servicemonitor_crd
  failed_when: false
  changed_when: false
  when: inventory_hostname in groups['bootstrap']

- name: Enable Cilium and Hubble metrics
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    name: cilium
    chart_ref: cilium/cilium
    release_namespace: kube-system
    create_namespace: false
    reset_values: true
    values: "{{ lookup('template', 'templates/values-cilium-metrics.yml.j2') | from_yaml }}"
    wait: true
    timeout: 10m
  when: inventory_hostname in groups['bootstrap']

- name: Verify Cilium pods
  command: kubectl -n kube-system rollout status ds/cilium --timeout=180s
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  changed_when: false
  when: inventory_hostname in groups['bootstrap']

- name: Detect architecture
  command: uname -m
  register: uname_m
  changed_when: false
  when: inventory_hostname in groups['bootstrap']

- name: Set Cilium CLI architecture
  set_fact:
    cilium_cli_arch: "{{ 'arm64' if uname_m.stdout == 'aarch64' else 'amd64' }}"
  when: inventory_hostname in groups['bootstrap']

- name: Get latest stable Cilium CLI version
  uri:
    url: https://raw.githubusercontent.com/cilium/cilium-cli/main/stable.txt
    return_content: true
  register: cilium_cli_version
  when: inventory_hostname in groups['bootstrap']

- name: Download Cilium CLI archive
  get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version.content | trim }}/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
    dest: "/tmp/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
    mode: "0644"
  when: inventory_hostname in groups['bootstrap']

- name: Download Cilium CLI checksum
  get_url:
    url: "https://github.com/cilium/cilium-cli/releases/download/{{ cilium_cli_version.content | trim }}/cilium-linux-{{ cilium_cli_arch }}.tar.gz.sha256sum"
    dest: "/tmp/cilium-linux-{{ cilium_cli_arch }}.tar.gz.sha256sum"
    mode: "0644"
  when: inventory_hostname in groups['bootstrap']

- name: Verify Cilium CLI checksum
  command: "sha256sum --check cilium-linux-{{ cilium_cli_arch }}.tar.gz.sha256sum"
  args:
    chdir: /tmp
  changed_when: false
  when: inventory_hostname in groups['bootstrap']

- name: Install Cilium CLI binary
  unarchive:
    src: "/tmp/cilium-linux-{{ cilium_cli_arch }}.tar.gz"
    dest: /usr/local/bin
    remote_src: true
    mode: "0755"
  when: inventory_hostname in groups['bootstrap']

- name: Verify Cilium CLI
  command: cilium version --client
  changed_when: false
  when: inventory_hostname in groups['bootstrap']
