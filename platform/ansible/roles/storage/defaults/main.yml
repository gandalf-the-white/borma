---
# defaults file for ansible/roles/storage
packages:
  - bastille

bastille_interface: "eth0"
bastille_release: "15.0-RELEASE"

jails:
  - name: nfs-server
    octet: "210"
    packages:
      - htop
      - tree
    daemons: []
    services: []
    ports: []
    accounts:
      - name: spike
        uid: 1010
        gid: 1010
      - name: faye
        uid: 1020
        gid: 1020
    new_groups:
      - name: crew
        gid: 1030
      - name: spike
        gid: 1010
      - name: faye
        gid: 1020

  - name: nats-server
    octet: "211"
    packages:
      - htop
      - nats-server
    daemons:
      - nats
    services:
      - nats
    ports:
      - port: 4222
        proto: tcp
    accounts:
      - name: spike
        uid: 1010
        gid: 1010
      - name: faye
        uid: 1020
        gid: 1020
    new_groups:
      - name: crew
        gid: 1030
      - name: spike
        gid: 1010
      - name: faye
        gid: 1020
