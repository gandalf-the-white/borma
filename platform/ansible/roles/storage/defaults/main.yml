---
# defaults file for ansible/roles/storage
packages:
  - bastille

bastille_interface: "eth0"
bastille_release: "15.0-RELEASE"

jails:
  - name: nfs
    octet: "210"
    packages:
      - htop
      - tree
    services:
      - nfs_server
      - mountd
      - rpcbind
    ports:
      - port: 2049
        proto: tcp
      - port: 111
        proto: udp
  - name: dns
    octet: "211"
    packages:
      - htop
      - bind920
    services:
      - named
    ports:
      - port: 953
        proto: tcp
