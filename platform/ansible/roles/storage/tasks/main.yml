---
# tasks file for ansible/roles/storage
- name: Set runtime hostname
  ansible.builtin.command: hostname {{ hostname }}

- name: Persist hostname in rc.conf
  ansible.builtin.lineinfile:
    path: /etc/rc.conf
    regexp: "^hostname="
    line: 'hostname="{{ hostname }}"'
    create: yes

- name: Install bastille and more
  community.general.pkgng:
    name: "{{ item }}"
    state: present
  with_items: "{{ packages }}"

- name: Enable bastille at boot
  community.general.sysrc:
    name: bastille_enable
    value: "YES"

- name: Clone interface
  ansible.builtin.shell: /usr/sbin/sysrc cloned_interfaces+=lo1

- name: Name interface
  community.general.sysrc:
    name: ifconfig_lo1_name
    value: "bastille0"

- name: Start service
  ansible.builtin.shell: /usr/sbin/service netif cloneup
  register: result_service

- name: Bootstrap Bastille release
  command: bastille bootstrap {{ bastille_release }}
  args:
    creates: "/usr/local/bastille/releases/{{ bastille_release }}"

- name: Create jail
  ansible.builtin.shell: "bastille create {{ item.name }} {{ bastille_release }}  {{ prefix }}.{{ item.octet }} {{ bastille_interface }}"
  with_items: "{{ jails }}"
  args:
    creates: "/usr/local/bastille/jails/{{ item.name }}"

- name: Add proxy pkg
  ansible.builtin.blockinfile:
    path: /usr/local/etc/pkg.conf
    block: |
      PKG_ENV: {
        HTTP_PROXY  : "{{ http_proxy }}"
        HTTPS_PROXY : "{{ https_proxy }}"
      }
    append_newline: true
    prepend_newline: true

- name: Create directory pk
  file:
    path: "/usr/local/bastille/jails/{{ item.name }}/root/usr/local/etc"
    state: directory
    recurse: yes
  loop: "{{ jails }}"

- name: Add proxy pkg
  ansible.builtin.blockinfile:
    path: "/usr/local/bastille/jails/{{ item.name }}/root/usr/local/etc/pkg.conf"
    block: |
      PKG_ENV: {
        HTTP_PROXY  : "{{ http_proxy }}"
        HTTPS_PROXY : "{{ https_proxy }}"
      }
    create: true
  loop: "{{ jails }}"

- name: Update jail
  ansible.builtin.shell: "bastille cmd {{ item.name }} env ASSUME_ALWAYS_YES=yes pkg update "
  with_items: "{{ jails }}"

######################################
# DAEMON CONFIGURATION
######################################

- name: Enable nfs at boot
  community.general.sysrc:
    name: nfs_server_enable
    value: "YES"

- name: Enable mount at boot
  community.general.sysrc:
    name: mountd_enable
    value: "YES"

- name: Enable rpcbind at boot
  community.general.sysrc:
    name: rpcbind_enable
    value: "YES"

- name: Add packages
  ansible.builtin.command: "bastille pkg {{ item.0.name }} install -y {{ item.1 }}"
  loop: "{{ jails | subelements('packages', skip_missing=True) }}"

- name: Enable packages in jail
  ansible.builtin.shell: >
    bastille sysrc {{ item.0.name }} {{item.1}}_enable=YES
  loop: "{{ jails | subelements('daemons', skip_missing=True) }}"

- name: Deploy pf.conf
  template:
    src: pf.conf.j2
    dest: /etc/pf.conf
    owner: root
    group: wheel
    mode: "0644"

######################################
# NATS CONFIGURATION
######################################

- name: Get nats jail
  set_fact:
    nats_jail: "{{ jails | selectattr('name', 'equalto', 'nats-server') | first }}"

- name: Deploy nats-server
  template:
    src: nats-server.j2
    dest: "/usr/local/bastille/jails/{{ nats_jail.name }}/root/usr/local/etc/nats-server"
    owner: root
    group: wheel
    mode: "0644"
  when: nats_jail is defined

- name: Restart services in jails
  ansible.builtin.command: >
    bastille service {{ nats_jail.name }} {{ item }} restart
  loop: "{{ nats_jail.services }}"

######################################
# NFS CONFIGURATION PERMISSIONS
######################################

- name: Get nfs jail
  set_fact:
    nfs_jail: "{{ jails | selectattr('name', 'equalto', 'nfs-server') | first }}"

- name: Create NFS directory
  file:
    path: "/usr/local/bastille/jails/{{ nfs_jail.name }}/root/nfs"
    owner: 0
    group: 0
    mode: "0755"
    state: directory
  when: nfs_jail is defined

- name: Check if group exists in jail
  command: >
    bastille cmd {{ item.0.name }} pw groupshow {{ item.1.name }}
  register: jail_group_check
  failed_when: false
  changed_when: false
  loop: "{{ jails | subelements('new_groups', skip_missing=True) }}"

- name: Add groups in jail
  command: >
    bastille cmd {{ item.item.0.name }} pw groupadd -n {{ item.item.1.name }} -g {{ item.item.1.gid }}
  loop: "{{ jail_group_check.results }}"
  when: item.rc != 0

- name: Check if user exists in jail
  command: >
    bastille cmd {{ item.0.name }} pw usershow {{ item.1.name }}
  register: jail_user_check
  failed_when: false
  changed_when: false
  loop: "{{ jails | subelements('accounts', skip_missing=True) }}"

- name: Add users in jail
  command: >
    bastille cmd {{ item.item.0.name }} pw useradd -n {{ item.item.1.name }}
    -u {{ item.item.1.uid }}
    -g {{ item.item.1.gid }}
    -G wheel
    -c "{{ item.item.1.name }}"
    -m
    -s /bin/tcsh
  loop: "{{ jail_user_check.results }}"
  when: item.rc != 0

- name: Create home directories in jail rootfs
  file:
    path: "/usr/local/bastille/jails/{{ item.0.name }}/root/home/{{ item.1.name }}"
    owner: "{{ item.1.uid }}"
    group: "{{ item.1.gid }}"
    mode: "0700"
    state: directory
  loop: "{{ jails | subelements('accounts', skip_missing=True) }}"

- name: Create NFS directories in jail rootfs
  file:
    path: "/usr/local/bastille/jails/{{ item.0.name }}/root/nfs/{{ item.1.name }}"
    owner: "{{ item.1.uid }}"
    group: "{{ item.1.gid }}"
    mode: "0700"
    state: directory
  loop: "{{ jails | subelements('accounts', skip_missing=True) }}"

- name: Create shared group directories in jail rootfs
  file:
    path: "/usr/local/bastille/jails/{{ item.0.name }}/root/nfs/{{ item.1.name }}"
    owner: 0
    group: "{{ item.1.gid }}"
    mode: "0770"
    state: directory
  loop: "{{ jails | subelements('new_groups', skip_missing=True) }}"
  when: item.1.name not in (item.0.accounts | map(attribute='name') | list)

- name: Create shared directories in jail rootfs
  file:
    path: "/usr/local/bastille/jails/{{ nfs_jail.name }}/root/nfs/kube"
    owner: nobody
    group: nobody
    mode: "1777"
    state: directory
  when: nfs_jail is defined

- name: Deploy exports
  template:
    src: exports.j2
    # dest: "/usr/local/bastille/jails/{{ nfs_jail.name }}/root/etc/exports"
    dest: "/etc/exports"
    owner: root
    group: wheel
    mode: "0644"
  # when: nfs_jail is defined

- name: Restart services in jails
  ansible.builtin.command: >
    bastille service {{ item.0.name }} {{ item.1 }} restart
  loop: "{{ jails | subelements('services', skip_missing=True) }}"
  loop_control:
    label: "[{{ item.0.name }}] {{ item.1 }}"

######################################
# PF CONFIGURATION
######################################

- name: Check if pf module is loaded
  command: kldstat -n pf
  register: pf_loaded
  failed_when: false
  changed_when: false

- name: Load pf module if not loaded
  command: kldload pf
  when: pf_loaded.rc != 0

- name: check pf.conf
  command: pfctl -vnf /etc/pf.conf
  register: pf_check
  changed_when: false

- name: reload pf
  command: pfctl -f /etc/pf.conf
  when: pf_check.rc == 0
  notify: reload pf

######################################
# PF CONFIGURATION
######################################

- name: Configure tcsh prompt
  ansible.builtin.lineinfile:
    path: "/usr/local/bastille/jails/{{ item.0.name }}/root/home/{{ item.1.name }}/.cshrc"
    regexp: '^\s*set\s+prompt\s*=.*'
    line: '	set prompt="%{\033[0m%}\n%{\033[0;32m%}%n@%m%{\033[0m%}:%{\033[0;33m%}%~%{\033[0m%} %# "'
    create: true
  loop: "{{ jails | subelements('accounts', skip_missing=True) }}"
  tags: prompt

######################################
# RESTART DAEMONS
######################################

- name: Ensure service are running
  ansible.builtin.shell: >
    service {{ item }} restart
  loop:
    - rpcbind
    - nfsd
    - mountd
