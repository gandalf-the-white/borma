---
- name: Set runtime hostname
  ansible.builtin.hostname:
    name: "{{ hostname }}"

- name: Persist hostname in rc.conf
  community.general.sysrc:
    name: hostname
    value: "{{ hostname }}"

- name: Install host packages
  community.general.pkgng:
    name: "{{ packages }}"
    state: present

- name: Enable bastille at boot
  community.general.sysrc:
    name: bastille_enable
    value: "YES"

- name: Configure Bastille loopback clone
  community.general.sysrc:
    name: cloned_interfaces
    value: lo1

- name: Rename lo1 to bastille0
  community.general.sysrc:
    name: ifconfig_lo1_name
    value: "{{ bastille_interface }}"

- name: Bring cloned interfaces up
  ansible.builtin.command: service netif cloneup
  changed_when: false

- name: Bootstrap Bastille release
  ansible.builtin.command: "bastille bootstrap {{ bastille_release }}"
  args:
    creates: "/usr/local/bastille/releases/{{ bastille_release }}"

######################################
# PF CONFIGURATION
######################################

- name: Deploy pf.conf
  ansible.builtin.template:
    src: pf.conf.j2
    dest: /etc/pf.conf
    owner: root
    group: wheel
    mode: "0644"
  notify: reload pf

- name: Check if pf kernel module is loaded
  ansible.builtin.command: kldstat -n pf
  register: pf_loaded
  failed_when: false
  changed_when: false

- name: Load pf kernel module
  ansible.builtin.command: kldload pf
  when: pf_loaded.rc != 0

- name: Enable pf at boot
  community.general.sysrc:
    name: pf_enable
    value: "YES"

- name: Validate pf.conf
  ansible.builtin.command: pfctl -vnf /etc/pf.conf
  changed_when: false

- name: Ensure pf is running
  ansible.builtin.service:
    name: pf
    state: started

###################################################
# CREATE JAILS
###################################################

- name: Create jails
  ansible.builtin.command: >-
    bastille create {{ item.name }} {{ bastille_release }}
    {{ item.prefix }}.{{ item.octet }} {{ bastille_interface }}
  loop: "{{ jails }}"
  args:
    creates: "/usr/local/bastille/jails/{{ item.name }}"

- name: Copy host resolv.conf into jails
  ansible.builtin.copy:
    src: /etc/resolv.conf
    dest: "/usr/local/bastille/jails/{{ item.name }}/root/etc/resolv.conf"
    remote_src: true
    owner: root
    group: wheel
    mode: "0644"
  loop: "{{ jails }}"

- name: Ensure jail pkg configuration directory exists
  ansible.builtin.file:
    path: "/usr/local/bastille/jails/{{ item.name }}/root/usr/local/etc"
    state: directory
    owner: root
    group: wheel
    mode: "0755"
  loop: "{{ jails }}"

- name: Configure jail pkg proxy
  ansible.builtin.blockinfile:
    path: "/usr/local/bastille/jails/{{ item.name }}/root/usr/local/etc/pkg.conf"
    create: true
    marker: "# {mark} ANSIBLE MANAGED PKG PROXY"
    block: |
      PKG_ENV: {
        HTTP_PROXY  : "{{ http_proxy | default('') }}"
        HTTPS_PROXY : "{{ https_proxy | default('') }}"
      }
  loop: "{{ jails }}"
  when: http_proxy is defined or https_proxy is defined

- name: Update pkg catalog in jails
  ansible.builtin.command: "bastille cmd {{ item.name }} env ASSUME_ALWAYS_YES=yes pkg update"
  loop: "{{ jails }}"
  register: jail_pkg_update
  changed_when: "'No updates' not in jail_pkg_update.stdout"

######################################
# DAEMON CONFIGURATION
######################################

- name: Install packages in jails
  ansible.builtin.command: "bastille pkg {{ item.0.name }} install -y {{ item.1 }}"
  loop: "{{ jails | subelements('packages', skip_missing=True) }}"
  register: jail_pkg_install
  changed_when: "'already installed' not in jail_pkg_install.stdout"

- name: Enable daemons in jails
  ansible.builtin.command: "bastille sysrc {{ item.0.name }} {{ item.1 }}_enable=YES"
  loop: "{{ jails | subelements('daemons', skip_missing=True) }}"

- name: Get nfs jail
  ansible.builtin.set_fact:
    nfs_jail: "{{ jails | selectattr('name', 'equalto', nfs_jail_name) | first }}"

- name: Check if group exists in jail
  ansible.builtin.command: "bastille cmd {{ item.0.name }} pw groupshow {{ item.1.name }}"
  register: jail_group_check
  failed_when: false
  changed_when: false
  loop: "{{ jails | subelements('new_groups', skip_missing=True) }}"

- name: Add missing groups in jail
  ansible.builtin.command: "bastille cmd {{ item.item.0.name }} pw groupadd -n {{ item.item.1.name }} -g {{ item.item.1.gid }}"
  loop: "{{ jail_group_check.results }}"
  when: item.rc != 0

- name: Check if user exists in jail
  ansible.builtin.command: "bastille cmd {{ item.0.name }} pw usershow {{ item.1.name }}"
  register: jail_user_check
  failed_when: false
  changed_when: false
  loop: "{{ jails | subelements('accounts', skip_missing=True) }}"

- name: Add missing users in jail
  ansible.builtin.command: >-
    bastille cmd {{ item.item.0.name }} pw useradd -n {{ item.item.1.name }}
    -u {{ item.item.1.uid }} -g {{ item.item.1.gid }} -G wheel
    -c {{ item.item.1.name | quote }} -m -s /bin/tcsh
  loop: "{{ jail_user_check.results }}"
  when: item.rc != 0

- name: Create source NFS directories in jail rootfs
  ansible.builtin.file:
    path: "/usr/local/bastille/jails/{{ nfs_jail.name }}/root/nfs/{{ item.name }}"
    owner: "{{ item.owner }}"
    group: "{{ item.group }}"
    mode: "{{ item.mode }}"
    state: directory
  loop: "{{ nfs_exports }}"

- name: Create nullfs mount points on host
  ansible.builtin.file:
    path: "/srv/nfs/{{ item.name }}"
    owner: root
    group: wheel
    mode: "0755"
    state: directory
  loop: "{{ nfs_exports }}"

- name: Mount nullfs exports on host
  ansible.posix.mount:
    src: "/usr/local/bastille/jails/{{ nfs_jail.name }}/root/nfs/{{ item.name }}"
    path: "/srv/nfs/{{ item.name }}"
    fstype: nullfs
    opts: rw
    state: mounted
  loop: "{{ nfs_exports }}"

######################################

# NFS / RPC CONFIGURATION

######################################

- name: Enable rpcbind

  community.general.sysrc:
    name: rpcbind_enable
    value: "YES"

- name: Configure mountd with fixed port
  community.general.sysrc:
    name: mountd_flags
    value: "-n -p 892"

- name: Enable and configure rpc.statd
  community.general.sysrc:
    name: rpc_statd_enable
    value: "YES"

- name: Set rpc.statd port
  community.general.sysrc:
    name: rpc_statd_flags
    value: "-p 1003"

- name: Enable and configure rpc.lockd
  community.general.sysrc:
    name: rpc_lockd_enable
    value: "YES"

- name: Set rpc.lockd port
  community.general.sysrc:
    name: rpc_lockd_flags
    value: "-p 894"

- name: Enable NFS server
  community.general.sysrc:
    name: nfs_server_enable
    value: "YES"

- name: Configure NFS server flags (TCP+UDP, threads)
  community.general.sysrc:
    name: nfs_server_flags
    value: "-u -t -n 8"

# OPTION: NFSv4 only (décommente si tu veux simplifier)
# - name: Enable NFSv4 only
#   community.general.sysrc:
#     name: nfsv4_server_enable
#     value: "YES"

######################################
# EXPORTS
######################################

- name: Deploy exports
  ansible.builtin.template:
    src: exports.j2
    dest: /etc/exports
    owner: root
    group: wheel
    mode: "0644"
  notify: reload mountd

- name: Enable NFS host services
  community.general.sysrc:
    name: "{{ item.name }}"
    value: "{{ item.value }}"
  loop:
    - { name: rpcbind_enable, value: "YES" }
    - { name: nfs_server_enable, value: "YES" }
    - { name: nfsv4_server_enable, value: "NO" }
    - { name: mountd_enable, value: "YES" }
    - { name: rpc_statd_enable, value: "YES" }
    - { name: rpc_lockd_enable, value: "YES" }
    - { name: nfs_server_flags, value: "-u -t -n 8" }
    - { name: mountd_flags, value: "-n -p {{ mountd_port }}" }
    - { name: rpc_statd_flags, value: "-p {{ rpc_statd_port }}" }
    - { name: rpc_lockd_flags, value: "-p {{ rpc_lockd_port }}" }
  notify: restart nfs services

- name: Allow non-reserved ports for nfsd
  ansible.posix.sysctl:
    name: vfs.nfsd.nfs_privport
    value: "0"
    state: present

- name: Ensure NFS services are running
  ansible.builtin.service:
    name: "{{ item }}"
    state: started
  loop:
    - rpcbind
    - statd
    - lockd
    - nfsd
    - mountd

- name: Restart jail services
  ansible.builtin.command: "bastille service {{ item.0.name }} {{ item.1 }} restart"
  loop: "{{ jails | subelements('services', skip_missing=True) }}"
  loop_control:
    label: "[{{ item.0.name }}] {{ item.1 }}"
