---
# tasks file for ansible/roles/hoover
- name: prerequisites
  apt:
    name: python3-pip
    state: present

- name: Replace pip per apt
  apt:
    name: "{{ pip_packages }}"
    state: present

# - name: Check eBPF support
#   command: bpftool prog list
#   register: ebpf_check
#   failed_when: ebpf_check.rc != 0

- name: Install helm if not exists
  unarchive:
    src: "https://get.helm.sh/helm-v{{ addons_helm_version }}-linux-amd64.tar.gz"
    dest: /usr/local/bin
    extra_opts: "--strip-components=1"
    owner: root
    group: root
    mode: 0755
    remote_src: true
  args:
    creates: /usr/local/bin/helm

- name: Install Helm Diff
  kubernetes.core.helm_plugin:
    plugin_path: "https://github.com/databus23/helm-diff"
    state: present

- name: Add Helm repo
  kubernetes.core.helm_repository:
    name: "{{item.name}}"
    repo_url: "{{item.url}}"
  loop: "{{ helm_repos }}"
  tags: hoover

- name: Deploy releases (Loki Tempo Grafana Parca)
  kubernetes.core.helm:
    name: "{{ item.name }}"
    chart_ref: "{{ item.chart_ref }}"
    chart_version: "{{ item.chart_version }}"
    release_namespace: "{{ obs_namespace }}"
    create_namespace: true
    kubeconfig: "{{ kubeconfig_path }}"
    update_repo_cache: true
    wait: true
    timeout: 900s
    values: "{{ lookup('file', 'files/' ~ item.values_file) | from_yaml }}"
  loop: "{{ helm_releases }}"
  tags: hoover
