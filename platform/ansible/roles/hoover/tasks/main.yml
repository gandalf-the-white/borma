- name: Deploy kubernetes-event-exporter
  kubernetes.core.helm:
    kubeconfig: "{{ kubeconfig }}"
    name: kubernetes-event-exporter
    chart_ref: bitnami/kubernetes-event-exporter
    # chart_repo_url: https://charts.bitnami.com/bitnami
    release_namespace: "{{ monitoring_namespace }}"
    create_namespace: true
    update_repo_cache: true
    values: "{{ lookup('template', 'templates/values-kubernetes-event-exporter.yml.j2') | from_yaml }}"
    wait: true
    timeout: 5m

- name: Final verification
  command: kubectl -n {{ monitoring_namespace }} get pods,pvc,svc
  changed_when: false
