---
- name: Set hostname
  hostname:
    name: "{{ inventory_hostname }}"

- name: Show detected kernel
  ansible.builtin.debug:
    msg: "Kernel detected: {{ ansible_kernel }}"

- name: Update apt cache
  apt:
    update_cache: yes
    cache_valid_time: 3600

- name: Install Common packages
  apt:
    name: "{{ packages }}"
    state: present

- name: Check availability of running kernel headers
  ansible.builtin.command:
    cmd: "apt-cache policy linux-headers-{{ ansible_kernel }}"
  register: kernel_headers_package
  changed_when: false

- name: Show kernel headers package information
  ansible.builtin.debug:
    var: kernel_headers_package.stdout_lines

- name: Install running kernel headers
  ansible.builtin.apt:
    name: "linux-headers-{{ ansible_kernel }}"
    state: present
  become: true

- name: Check kernel headers
  ansible.builtin.stat:
    path: "/lib/modules/{{ ansible_kernel }}/build"
  register: kernel_headers

- name: Verify kernel headers are installed
  ansible.builtin.assert:
    that:
      - kernel_headers.stat.exists
    fail_msg: >
      Kernel headers for {{ ansible_kernel }} are missing.
      Pixie eBPF/BCC programs will not compile.

- name: Download k3s
  get_url:
    url: "https://get.k3s.io"
    dest: /tmp/script.sh
    use_proxy: yes
    mode: "u+x"

- name: Create directory for PVC
  file:
    path: /mnt/data/videos
    state: directory
    mode: "0777"

- name: Disable swap
  command: swapoff -a
  when: ansible_swaptotal_mb > 0

- name: Disable swap in fstab
  replace:
    path: /etc/fstab
    regexp: "^([^#].*swap.*)$"
    replace: '# \1'

- name: Load kernel modules
  copy:
    dest: /etc/modules-load.d/k8s.conf
    content: |
      overlay
      br_netfilter

- name: Sysctl config
  copy:
    dest: /etc/sysctl.d/k8s.conf
    content: |
      net.bridge.bridge-nf-call-iptables = 1
      net.ipv4.ip_forward = 1
      net.bridge.bridge-nf-call-ip6tables = 1

- name: Sysctl config watches
  copy:
    dest: /etc/sysctl.d/watch.conf
    content: |
      fs.inotify.max_user_instances=8192
      fs.inotify.max_user_watches=524288
      # fs.aio-max-nr=524288
      # fs.file-max=524288
      # kernel.threads-max=524288

- name: Apply sysctl
  command: sysctl --system
