---
# Tasks
- name: Wait for API server
  delegate_to: "{{ groups['bootstrap'][0] }}"
  command: kubectl get nodes
  register: __cmd_res
  retries: 30
  delay: 5
  until: __cmd_res.rc == 0

- name: Get join command
  delegate_to: "{{ groups['bootstrap'][0] }}"
  command: cat /var/lib/rancher/k3s/server/node-token
  register: __k3s_token
  run_once: true

- name: Check if server already installed is ready
  delegate_to: "{{ groups['bootstrap'][0] }}"
  shell: kubectl get nodes
  register: __cmd_res
  changed_when: __cmd_res.rc != 0

- name: Join a master
  command: /tmp/script.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_BIN_DIR: /usr/local/bin
    INSTALL_K3S_EXEC: >
      server
      --server https://{{ hostvars[groups['bootstrap'][0]]['ansible_host'] }}:6443
      --token {{ __k3s_token.stdout }}
      --advertise-address={{ advertise_address }}
      --tls-san={{ advertise_address }}
      --flannel-backend=none
      --disable-network-policy
      --disable-kube-proxy
      --disable=servicelb
      --disable=local-storage
      --disable=traefik
  when: inventory_hostname in groups['master_nodes']

- name: Join a worker.
  command: /tmp/script.sh
  environment:
    INSTALL_K3S_VERSION: "{{ k3s_version }}"
    INSTALL_K3S_BIN_DIR: /usr/local/bin
    INSTALL_K3S_EXEC: "agent"
    K3S_URL: "https://{{ hostvars[groups['bootstrap'][0]]['ansible_facts']['default_ipv4']['address'] }}:6443"
    K3S_TOKEN: "{{ __k3s_token.stdout }}"
  when: inventory_hostname in groups['worker_nodes']
