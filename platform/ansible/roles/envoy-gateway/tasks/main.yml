- name: Copy gatewayclass
  copy:
    src: "{{ item }}"
    dest: /tmp
  loop:
    - gatewayclass.yaml
    - gateway.yaml
  when: groups['bootstrap'] | length  == 1

- name: Install gatewayclass
  kubernetes.core.k8s:
    state: present
    src: /tmp/gatewayclass.yaml
  when: groups['bootstrap'] | length  == 1
