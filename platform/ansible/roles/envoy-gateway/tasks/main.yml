- name: Install Helm
  shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  when: groups['bootstrap'] | length  == 1

- name: Créer le namespace pour Envoy Gateway
  kubernetes.core.k8s:
    name: "{{ name_space }}"
    api_version: v1
    kind: Namespace
    state: present
  when: groups['bootstrap'] | length  == 1

- name: Install EG
  kubernetes.core.helm:
    chart_ref: oci://docker.io/envoyproxy/gateway-helm
    chart_version: "{{ envoy_gateway_version }}"
    create_namespace: false
    release_name: envoy-gateway
    release_namespace: "{{ name_space }}"
    release_state: present
    update_repo_cache: true
  when:
    groups['bootstrap'] | length  == 1
