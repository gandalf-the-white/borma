---
# tasks file for ansible/roles/pixie
- name: Prequisite
  tags: prerequesite
  block:
    - name: Update apt cache
      apt:
        update_cache: yes
        cache_valid_time: 3600

    - name: Install packages
      apt:
        name: "{{ packages }}"
        state: present

    - name: Fetch Kustomize
      ansible.builtin.get_url:
        url: "{{ kustomize_url }}/kustomize%2Fv{{kustomize_version}}/kustomize_v{{kustomize_version}}_linux_amd64.tar.gz"
        dest: "/tmp/kustomize_v{{kustomize_version}}_linux_amd64.tar.gz"
      tags: kustomize

    - name: Unarchive Kustomize
      ansible.builtin.unarchive:
        src: "/tmp/kustomize_v{{kustomize_version}}_linux_amd64.tar.gz"
        dest: /usr/local/bin
        owner: root
        group: root
        mode: "0755"
        remote_src: yes
      tags: kustomize

    - name: Wait for kubeconfig
      wait_for:
        path: /etc/rancher/k3s/k3s.yaml
        timeout: 60

    - name: Set kubeconfig env
      set_fact:
        kubeconfig: /etc/rancher/k3s/k3s.yaml

    - name: Wait for Kubernetes API
      command: kubectl get nodes
      environment:
        KUBECONFIG: "{{ kubeconfig }}"
      register: result
      retries: 10
      delay: 5
      until: result.rc == 0

    - name: Verify cluster access
      command: kubectl get nodes
      changed_when: false

    - name: Verify NFS StorageClass exists
      command: kubectl get storageclass {{ storage_class }}
      changed_when: false

    - name: Create pixie namespace
      kubernetes.core.k8s:
        kubeconfig: "{{ kubeconfig }}"
        api_version: v1
        kind: Namespace
        name: "{{ pixie_namespace_cloud }}"
        state: present

    - name: Clone Pixie repository
      ansible.builtin.git:
        repo: "{{ pixie_repo_url }}"
        dest: "{{ pixie_repo_dir }}"
        update: true
        force: true
