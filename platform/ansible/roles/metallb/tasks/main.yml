---
# tasks file for roles/metallb
- name: prerequisites
  apt:
    name: python3-pip
    state: present
  when: groups['bootstrap'] | length  == 1

- name: Replace pip per apt
  apt:
    name: "{{ pip_packages }}"
    state: present
  when: groups['bootstrap'] | length  == 1

- name: Install Helm
  shell: curl https://raw.githubusercontent.com/helm/helm/main/scripts/get-helm-3 | bash
  args:
    creates: /usr/local/bin/helm
  when: groups['bootstrap'] | length  == 1

- name: Install Helm Diff
  kubernetes.core.helm_plugin:
    plugin_path: "https://github.com/databus23/helm-diff"
    state: present
  tags:
    - helm
  when: groups['bootstrap'] | length  == 1

- name: Add stable Metallb chart repo
  kubernetes.core.helm_repository:
    name: metallb
    repo_url: "https://metallb.github.io/metallb"
  when: groups['bootstrap'] | length  == 1

- name: Install metallb
  kubernetes.core.helm:
    name: metallb-system
    chart_ref: metallb/metallb
    release_namespace: metallb-system
    create_namespace: true
    values:
      speaker:
        frr:
          enabled: false
  when: groups['bootstrap'] | length  == 1

- name: Wait until install done
  kubernetes.core.k8s_info:
    kind: Pod
    label_selectors:
      - app.kubernetes.io/name=metallb
    wait: true
    namespace: metallb-system
    wait_sleep: 5
    wait_timeout: 150
  when: groups['bootstrap'] | length  == 1

- name: Wait for MetalLB CRDs
  command: kubectl get crd ipaddresspools.metallb.io l2advertisements.metallb.io
  environment:
    KUBECONFIG: "{{ kubeconfig }}"
  register: metallb_crds
  retries: 20
  delay: 5
  until: metallb_crds.rc == 0
  changed_when: false

- name: Apply the configuration
  kubernetes.core.k8s:
    namespace: metallb-system
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: IPAddressPool
      metadata:
        name: ingress-pool
        namespace: metallb-system
      spec:
        addresses:
          - "{{ metallb_pool_start }}-{{ metallb_pool_end }}"
  when: groups['bootstrap'] | length  == 1

- name: Apply the advertisement
  kubernetes.core.k8s:
    namespace: metallb-system
    state: present
    definition:
      apiVersion: metallb.io/v1beta1
      kind: L2Advertisement
      metadata:
        name: l2advertisement1
        namespace: metallb-system
      spec:
        ipAddressPools:
          - ingress-pool
  when: groups['bootstrap'] | length  == 1
