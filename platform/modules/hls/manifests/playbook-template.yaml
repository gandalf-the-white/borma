---
- name: install hls
  hosts: all
  become: true

  vars:
    jail: "${jail}"
    http_proxy: "${proxy}"
    https_proxy: "${proxy}"
    no_proxy: "${noproxy}"

  environment:
    http_proxy: "${proxy}"
    https_proxy: "${proxy}"
    no_proxy: "${noproxy}"

  roles:
    - roles/bastille
    - roles/videos
