---
- name: install Kubernetes
  hosts: all
  become: true
  serial: 1
  vars:
    kubeadm_init_master: "${kubeadm_init_master}"
    kubeadm_master_group_name: "${kubeadm_master_group_name}"
    kubeadm_worker_group_name: "${kubeadm_worker_group_name}"
    advertise_address: "${advertise_address}"
  environment:
    http_proxy: "${proxy}"
    https_proxy: "${proxy}"
    no_proxy: "${noproxy}"

  roles:
    - roles/k3s
    - roles/cilium

- name: install metallband, pixie
  hosts: bootstrap
  become: true
  vars:
    prefix: "${prefix}"
    area: "${area}"
    storage: "${storage}"
  environment:
    http_proxy: "${proxy}"
    https_proxy: "${proxy}"
    no_proxy: "${noproxy}"

  roles:
    - roles/metallb
    # - roles/envoy-gateway
    - roles/store-k3s
    # - roles/hoover
    # - pixie
    # - roles/demo
